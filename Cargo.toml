[package]
name = "misc-image-integration"
description = "basic image crate integration for kra and svg formats"
repository = "https://github.com/Elec3137/misc-image-integration"
license = "AGPL-3.0-or-later"
version = "0.1.1"
edition = "2024"

[features]
default = [ "kra", "svg" ]
svg = [ "dep:resvg" ]
kra = [ "dep:zip" ]

[dependencies]
image = "0.25.10"

[dependencies.resvg]
version = "0.48.1"
optional = true

[dependencies.zip]
version = "8.6.0"
optional = true
